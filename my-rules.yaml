sub-rules:
  # 谷歌流量专有处理管道 [cite: 177, 225]
  Google-Pipeline:
    # 阶段 ①：放行 Gemini Live 实时语音与交互端点 (最高优先级)
    - DOMAIN,generativelanguage.googleapis.com,Google
    - DOMAIN,alkalinetooling-pa.googleapis.com,Google
    - DOMAIN-SUFFIX,proactive-backend-pa.googleapis.com,Google

    # 阶段 ②：严格阻断 Google 定位 API 与地图全系服务
    - DOMAIN,location.googleapis.com,🚮丢弃
    - DOMAIN,geolocation.googleapis.com,🚮丢弃
    - DOMAIN-SUFFIX,maps.googleapis.com,🚮丢弃
    - DOMAIN,maps.gstatic.com,🚮丢弃
    - DOMAIN-KEYWORD,googlemaps,🚮丢弃

    # 阶段 ③：阻断 SDK 共享与追踪端点 (防直连泄露)
    - DOMAIN,clients4.google.com,🚮丢弃
    - DOMAIN,csi.gstatic.com,🚮丢弃

    # 阶段 ④：拦截 UDP 443 (QUIC)，解决 Play 商店下载卡“等待中”
    - AND,((NETWORK,UDP),(DST-PORT,443)),🚮丢弃

    # 阶段 ⑤：兜底流转 (剩余所有正常的谷歌流量走代理)
    - DOMAIN,mtalk.google.com,Google
    - DOMAIN-SUFFIX,fcm.googleapis.com,Google
    - DOMAIN-SUFFIX,googleapis.cn,Google
    - RULE-SET,google-android,Google
    - GEOSITE,google,Google
    - MATCH,Google

  # Vivo 系统地狱级广告拦截子管道
  Sub-Vivo-Hell-Block:
    - AND,((OR,((PROCESS-NAME,com.bbk.launcher2),(PROCESS-NAME,com.vivo.pushservice),(PROCESS-NAME,com.vivo.safecenter),(PROCESS-NAME,com.vivo.smartshot),(PROCESS-NAME,com.vivo.agent),(PROCESS-NAME,com.vivo.aiservice),(PROCESS-NAME,com.vivo.hiboard),(PROCESS-NAME,com.vivo.fingerprint),(PROCESS-NAME,com.vivo.connbase),(PROCESS-NAME,com.android.BBKCrontab))),(OR,((DOMAIN-KEYWORD,stsdk),(DOMAIN-KEYWORD,vpush),(DOMAIN-KEYWORD,moni),(DOMAIN-KEYWORD,vcode),(DOMAIN-REGEX,byteimg|baidu|xiaohongshu|google|jd|360|tieba)))),🚨广告拦截
    - MATCH,🇨🇳直连

