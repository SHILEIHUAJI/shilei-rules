### GitHub Actions 自动触发配置：`.github/workflows/check-a
name: Check proc-alias.yaml

on:
  push:
    branches:
      - Temporary-Files
    paths:
      - 'proc-alias.yaml'
      - 'check_proc_alias.py'
      - '.github/workflows/check-alias.yml'
  pull_request:
    paths:
      - 'proc-alias.yaml'
  workflow_dispatch: # 支持在 GitHub 页面手动点击触发运行

jobs:
  validate-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-language: '3.x'

      - name: 执行 proc-alias 检测脚本
        run: |
          python check_proc_alias.py
