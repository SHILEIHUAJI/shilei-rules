name: Auto Update Rule Count

on:
  push:
    paths:
      - '**.yaml'
      - '**.yml'
      - '**.txt'
      - '**.list'
      - 'count_rules.py'
    branches:
      - main
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yamllint

      - name: Lint YAML syntax
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, truthy: disable, document-start: disable}}" *.yaml || true

      - name: Run count script
        run: python count_rules.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 自动更新规则统计报告" && git push)
