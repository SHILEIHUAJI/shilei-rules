name: Clean mihomo logs

on:
  push:
    branches: [Temporary-Files]
    paths:
      - 'logs/**.log'
      - 'logs/**.txt'

permissions:
  contents: write
  models: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: Temporary-Files

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run cleaning script
        run: python3 scripts/clean_mihomo_logs.py logs cleaned-logs

      - name: Annotate domains with GitHub Models
        run: python3 scripts/annotate_domains.py cleaned-logs domain-notes.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cleaned-logs logs domain-notes.yaml
          git diff --cached --quiet || git commit -m "chore: clean + annotate mihomo logs [skip ci]"
          git push
